# Local development infrastructure only — Postgres + Redis. Not used in
# production (production connects to managed instances via DATABASE_URL /
# REDIS_URL like any other environment).
#
# Host ports are 5433/6380, not the Postgres/Redis defaults 5432/6379,
# deliberately: this service must be independently deployable and must
# never assume — let alone collide with — another Skout repository's
# docker-compose stack that might already be running on the same machine.
#
# Usage:
#   docker compose up -d          # start Postgres + Redis
#   npm run migrate:up            # apply migrations
#   docker compose down           # stop (add -v to also delete data volumes)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skout_warmup}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - skout_warmup_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skout_warmup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - skout_warmup_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skout_warmup_postgres_data:
  skout_warmup_redis_data:
